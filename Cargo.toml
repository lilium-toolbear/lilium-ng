[workspace]
members = [
    "crates/lilium-common",
    "crates/lilium-models",
    "crates/lilium-database",
    "crates/lilium-core",
    "crates/lilium-services",
    "binaries/lilium-spider",
    "binaries/lilium-event-processor",
]
resolver = "2"

[workspace.dependencies]
# 本地 crates
lilium-common = { path = "crates/lilium-common" }
lilium-models = { path = "crates/lilium-models" }
lilium-database = { path = "crates/lilium-database" }
lilium-core = { path = "crates/lilium-core" }
lilium-services = { path = "crates/lilium-services" }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 数据库
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "rust_decimal",
] }

# WebSocket
tungstenite = { version = "0.21", features = ["native-tls"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "cookies"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 配置
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 小数
rust_decimal = { version = "1", features = ["serde-with-str"] }

# 字符串枚举
strum = { version = "0.26", features = ["derive"] }

# 随机数
rand = "0.8"
