[workspace]
members = [
    "crates/lilium-common",
    "crates/lilium-models",
    "crates/lilium-database",
    "crates/lilium-test-fixtures",
    "crates/lilium-core",
    "crates/lilium-services",
    "crates/lilium-api-client",
    "binaries/lilium",
]
resolver = "2"

[workspace.dependencies]
# 本地 crates
lilium-common = { path = "crates/lilium-common" }
lilium-models = { path = "crates/lilium-models" }
lilium-database = { path = "crates/lilium-database" }
lilium-test-fixtures = { path = "crates/lilium-test-fixtures" }
lilium-core = { path = "crates/lilium-core" }
lilium-services = { path = "crates/lilium-services" }
lilium-api-client = { path = "crates/lilium-api-client" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }

# 数据库
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "rust_decimal",
] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
    "with-uuid",
] }

# WebSocket
futures = "0.3"
rust_socketio = { git = "https://github.com/kuma-dzmm/rust-socketio", rev = "2a9c637acf43c622247753bf608304ed5ae5b657", features = ["async"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# HTTP
reqwest = { version = "0.13", features = ["json"] }
kamadak-exif = "0.6.1"
lofty = "0.24.0"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 环境变量
dotenvy = "0.15.7"
url = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.48.2", features = ["tracing", "logs"] }
sentry-tracing = "0.48.2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# 错误处理
anyhow = "1"
thiserror = "2"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 小数
rust_decimal = { version = "1", features = ["serde-with-str"] }

# 字符串枚举
strum = { version = "0.28", features = ["derive"] }

# 随机数
rand = "0.10"
